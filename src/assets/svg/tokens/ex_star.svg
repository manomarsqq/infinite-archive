<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<defs>
 <radialGradient id="through" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.45" stop-color="#FFF4C2"/><stop offset="1" stop-color="#FFD166"/></radialGradient>
 <clipPath id="keyclip"><path d="M128 22 a44 44 0 1 0 0.01 0 Z M128 44 a22 22 0 1 1 -0.01 0 Z M116 104 h24 v96 h18 v16 h-18 v8 h14 v16 h-14 v8 h-24 Z" fill-rule="evenodd"/></clipPath>
 <filter id="bloom" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
 <filter id="edge" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
<!-- the light spilling out of the gap -->
<g filter="url(#bloom)" opacity="0.7"><path d="M128 22 a44 44 0 1 0 0.01 0 Z M128 44 a22 22 0 1 1 -0.01 0 Z M116 104 h24 v96 h18 v16 h-18 v8 h14 v16 h-14 v8 h-24 Z" fill-rule="evenodd" fill="#FFE9A0"/></g>
<!-- the air bends a little at the rim -->
<g filter="url(#edge)"><path d="M128 22 a44 44 0 1 0 0.01 0 Z M128 44 a22 22 0 1 1 -0.01 0 Z M116 104 h24 v96 h18 v16 h-18 v8 h14 v16 h-14 v8 h-24 Z" fill-rule="evenodd" fill="none" stroke="#1A1428" stroke-opacity="0.55" stroke-width="7"/></g>
<!-- the hole itself: whatever is on the other side -->
<g clip-path="url(#keyclip)">
 <rect x="0" y="0" width="256" height="256" fill="url(#through)"/>
 <ellipse cx="110" cy="80" rx="40" ry="60" fill="#FFFFFF" opacity="0.55">
  <animate attributeName="cx" values="110;150;110" dur="11s" repeatCount="indefinite"/>
 </ellipse>
</g>
</svg>