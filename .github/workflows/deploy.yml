# Build the site with Vite and publish it to GitHub Pages.
# Enable Pages for the repository first: Settings -> Pages -> Source: "GitHub Actions".
# Scroll data is pulled from a Google Sheet when the SHEETID and SHEETSAPIKEY secrets exist;
# without them the site is published with the sample data.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # rebuild daily so sheet edits reach the site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHEETID: ${{ secrets.SHEETID }}
      SHEETSAPIKEY: ${{ secrets.SHEETSAPIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build data from the sheet
        if: env.SHEETID != '' && env.SHEETSAPIKEY != ''
        run: npm run getData
      - name: Build the site
        # a project site lives at https://<user>.github.io/<repo>/, so asset urls need that prefix
        run: npm run viteBuild
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
